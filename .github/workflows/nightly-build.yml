name: Nightly Liveness Check

on:
  schedule:
  - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install checker dependencies
      run: |
        python3 -m pip install curl_cffi playwright
        python3 -m playwright install --with-deps --no-shell chromium
    - name: Check sites that should be live
      run: xvfb-run -a ./check.py
